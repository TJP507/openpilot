name: CI

# The single CI definition for the TylerPilot fork (STANDARD §5). PR-only.
#
# The build system is restored (root `SConstruct`/`SConscript` + ONNX models),
# so `build` runs a real `scons --minimal` on x64. The Python jobs still run a
# build-free subset for speed.
#
# The fork's baseline is not lint-clean (inherited upstream files carry ruff /
# codespell findings), so `lint` is scoped to the fork's own directories
# (`sunnypilot/` and `selfdrive/ui/sunnypilot/`); inherited upstream files are
# left untouched. The test jobs bypass the repo root `conftest.py` (it imports
# compiled modules: params_pyx.so, msgq/ipc_pyx.so) via `--confcutdir` and
# install only pip-resolvable deps.
#
# Runners: all self-hosted (fleet-wide, zero GitHub minutes).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  CI: "1"

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install -r .github/ci-requirements.txt
      - name: ruff check (fork dirs)
        run: ruff check sunnypilot selfdrive/ui/sunnypilot
      - name: codespell (fork dirs)
        run: codespell sunnypilot selfdrive/ui/sunnypilot --ignore-words=.codespellignore

  unit:
    name: unit
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r .github/ci-requirements.txt
      - name: Run pure-Python unit subset
        # Build-free subset: only tests that import without compiled artifacts
        # and do not pull a build-dependent conftest. Grows as the build returns.
        run: |
          pytest -o addopts="" --confcutdir=sunnypilot -m "not slow and not tici" \
            sunnypilot/mapd/tests/test_mapd_version.py \
            sunnypilot/selfdrive/selfdrived/tests/test_button_state_tracker.py

  tylerpilot:
    name: tylerpilot
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r .github/ci-requirements.txt
      - name: Run TylerPilot unit tests
        run: |
          if [ ! -d sunnypilot/tylerpilot/tests ]; then
            echo "no tylerpilot tests yet — skipping"
            exit 0
          fi
          pytest -o addopts="" --confcutdir=sunnypilot sunnypilot/tylerpilot/tests

  build:
    name: build
    # The build system (root SConstruct/SConscript + ONNX models) is restored
    # from sunnypilot master c440933a65 (see the restore commit). This job
    # builds the tree on x64 to prove the graph is valid and produces the
    # Cython/C++ artifacts. Device (aarch64) release artifacts are built by
    # `.github/workflows/release.yml` on a device runner.
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync Python environment
        run: uv sync
      - name: Build (scons --minimal)
        # capnpc/cython live in .venv/bin, so activate before invoking scons.
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD:$PWD/msgq_repo:$PWD/opendbc_repo:$PWD/rednose_repo:$PWD/tinygrad_repo"
          scons --minimal -j"$(nproc)"
      - name: Verify key artifacts
        run: |
          test -f common/params_pyx.so
          test -f msgq_repo/msgq/ipc_pyx.so
          test -f msgq_repo/msgq/visionipc/visionipc_pyx.so
