name: release

# Signed-release pipeline for the TylerPilot fork.
#
# Builds the tree and packages a `prebuilt.tar.gz` release artifact (mirrors
# upstream `sunnypilot-build-prebuilt.yaml`'s build stage). Signing is the next
# step and is NOT yet implemented — see `docs/tylerpilot-ota.md` §6: the agreed
# mechanism is a pinned Ed25519 key held in `bws`, with the public key shipped
# in the firmware. Until that lands this workflow produces an UNSIGNED artifact
# and does not publish anything.
#
# NOTE: the default runner below is x64, so it produces x64 artifacts and is
# useful for validating the pipeline. Device (comma 3X) releases need an
# aarch64 runner — upstream builds on `[self-hosted, tici]`. No such runner is
# registered for this fork yet.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build + package
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Sync Python environment
        run: uv sync
      - name: Build
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD:$PWD/msgq_repo:$PWD/opendbc_repo:$PWD/rednose_repo:$PWD/tinygrad_repo"
          scons --minimal -j"$(nproc)"
      - name: Package release tree
        # Strip transient build files (mirrors upstream's strip stage); keep
        # compiled libs/executables and the tinygrad pkl models.
        run: |
          find . -name '*.a' -delete
          find . -name '*.o' -delete
          find . -name '*.os' -delete
          find . -name '*.pyc' -delete
          find . -name '__pycache__' -type d -exec rm -rf {} + || true
          rm -f selfdrive/modeld/models/*.onnx
          tar czf prebuilt.tar.gz --exclude=.venv --exclude=.git .
          ls -la prebuilt.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz
          compression-level: 0

  # TODO(sign): after build, emit release.json (channel, version, commit,
  # tree_hash, min_agnos, rollout) and sign it with the pinned Ed25519 key
  # unsealed from bws; attach release.json + release.json.sig to a GitHub
  # Release. See docs/tylerpilot-ota.md §3.1–3.2.
